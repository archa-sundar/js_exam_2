<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joke Generator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-warning">
<div class="container py-5">
 <h2 class="text-center mb-4">Joke Generator</h2>
<div class="card shadow-sm mx-auto mb-5" style="max-width: 600px">
<div class="card-body text-center p-4">
  <h5 class="text-primary mb-3">Programming Joke</h5>
<h4 id="setup" class="mb-3">Loading joke...</h4>
 <p id="punchline" class="text-secondary fs-5"></p>
<span id="type" class="badge bg-info text-dark mb-4"></span>
 <button class="btn btn-primary me-2" onclick="getData()">
Generate New</button>
<button class="btn btn-outline-danger" onclick="addTofav()">
 Add to Fav
 </button>
 </div>
</div>
</div>
      <h3 class="mb-3">Favourite Jokes</h3>

 <div class="card shadow">
  <div class="card-body">
  <div id="result" class="row g-3"></div>
  </div>
  </div>
   </div>

    <script>
   let apiResponse = null;
            let favData = JSON.parse(localStorage.getItem("data")) || [];
            const getData = async () => {
              try {
  let apiResponse = await fetch(
 "https://official-joke-api.appspot.com/jokes/programming/ten",
 );
 let data = await apiResponse.json();
  document.getElementById("setup").innerText = apiResponse.setup;
  document.getElementById("punchline").innerText =
 apiResponse.punchline;
 document.getElementById("type").innerText = apiResponse.type;
 } catch (error) {
   console.log(error);
  alert("Error occurred");
}
};
getData();
favData.unshift(apiResponse);
localStorage.setItem("data", JSON.stringify(favData));
showFavData();

alert("Added to favourites!");

            const showFavData = () => {
              favData = JSON.parse(localStorage.getItem("data")) || [];

              let resultEl = document.getElementById("result");

              resultEl.innerHTML = "";

      favData.map(
      (eachData, index) =>
        (resultEl.innerHTML += `
        <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm"
         <div class="card-body">

        <span class=" bg-info text-dark mb-3">
                            ${eachData.type}
                          </span>

                          <h5 class="card-title">
                            ${eachData.setup}
                          </h5>

                          <p class="card-text text-secondary">
                            ${eachData.punchline}
                          </p>

                          <button
                            class="btn btn-sm btn-outline-danger"
                            onclick="deleteData(${eachData.punchline})">
                            Delete
                          </button>

                        </div>
                      </div>
                    </div>
                  `),
              );


                resultEl.innerHTML = `
                  <div class="col-12 text-center text-secondary">
                    No favourite jokes added yet!
                  </div>
                `;
              }
            };

            const deleteData = (index) => {
              favData.splice(index, 1);

              localStorage.setItem("data", JSON.stringify(favData));

              showFavData();

              alert("Deleted successfully!");
            };

            showFavData();
    </script>
  </body>
</html>
